<ul class="gallery">
    @for (image of images(); track image.src; let i = $index) {
        <li
            class="gallery-item"
            [class.gallery-item--tall]="image.variant === 'tall'"
            [class.gallery-item--wide]="image.variant === 'wide'"
        >
            <button type="button" (click)="open(image)">
                <img
                    [src]="image.src"
                    [alt]="caption(image, i)"
                    loading="lazy"
                    [attr.decoding]="decodingAsync() ? 'async' : null"
                />
                <span class="visually-hidden">Open full size</span>
            </button>
        </li>
    }
</ul>

<dialog #dialog class="lightbox" (click)="onBackdropClick($event)" (close)="current.set(null)">
    <button type="button" class="lightbox__close" aria-label="Close image" (click)="close()">
        &times;
    </button>
    @if (current(); as image) {
        <img [src]="image.src" [alt]="image.alt ?? 'Full size workshop photo'" />
    }
</dialog>
