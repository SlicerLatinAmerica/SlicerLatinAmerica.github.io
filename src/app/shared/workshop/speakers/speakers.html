<div class="speakers">
    @for (speaker of speakers(); track speaker.name) {
        @if (speaker.href) {
            <a [href]="speaker.href" target="_blank" rel="noopener" class="speaker">
                <img
                    [src]="speaker.img"
                    [alt]="speaker.alt ?? speaker.name"
                    width="128"
                    height="128"
                    loading="lazy"
                />
                <h3>{{ speaker.name }}</h3>
                <p>
                    <strong>{{ speaker.org }}</strong>
                </p>
                @if (speaker.bio) {
                    <p>{{ speaker.bio }}</p>
                }
                <span class="speaker__profile">See profile</span>
            </a>
        } @else {
            <div class="speaker">
                <img
                    [src]="speaker.img"
                    [alt]="speaker.alt ?? speaker.name"
                    width="128"
                    height="128"
                    loading="lazy"
                />
                <h3>{{ speaker.name }}</h3>
                <p>
                    <strong>{{ speaker.org }}</strong>
                </p>
                @if (speaker.bio) {
                    <p>{{ speaker.bio }}</p>
                }
            </div>
        }
    }
</div>
