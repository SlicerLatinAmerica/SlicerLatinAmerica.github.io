<footer>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 text-center">
                <a href="index.html">
                    <img src="./public/assets/img/icon.png" alt="3D Slicer" width="200" />
                </a>
            </div>
            <div class="col-12">
                <ul class="nav justify-content-center pb-3 mb-3">
                    @for (link of links; track link.key) {
                        <li class="nav-item">
                            <a [href]="link.href" class="nav-link px-2">{{
                                translated() ? ('footer.' + link.key | t) : link.label
                            }}</a>
                        </li>
                    }
                </ul>
            </div>
        </div>
    </div>
</footer>
