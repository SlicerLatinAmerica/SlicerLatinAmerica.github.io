<app-navbar active="tutorialCollection" />

<main id="main" class="page">
    <div class="page-header">
        <div class="container">
            <p class="page-header__eyebrow">{{ 'tutorialCollection.eyebrow' | t }}</p>
            <h1 class="page-header__title">{{ 'tutorialCollection.pageTitle' | t }}</h1>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <div class="prose">
                <p [innerHTML]="'tutorialCollection.intro' | tHtml"></p>
                <p [innerHTML]="'tutorialCollection.translationsNotice' | tHtml"></p>
            </div>
        </section>

        <section class="section">
            <app-tutorial-cards mode="collection" />
        </section>
    </div>
</main>

<app-site-footer />
