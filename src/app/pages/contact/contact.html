<app-navbar active="contact" />

<main id="main" class="page">
    <div class="page-header">
        <div class="container">
            <p class="page-header__eyebrow">{{ 'contact.eyebrow' | t }}</p>
            <h1 class="page-header__title">{{ 'contact.pageTitle' | t }}</h1>
            <p class="page-header__lead">{{ 'contact.lead' | t }}</p>
        </div>
    </div>

    <div class="container container--narrow">
        <div class="grid grid--2">
            <a class="contact-card" href="mailto:spujol@bwh.harvard.edu">
                <span class="contact-card__icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
                        <path d="m3 7 8.2 5.6a1.5 1.5 0 0 0 1.6 0L21 7" />
                    </svg>
                </span>
                <span class="contact-card__label">{{ 'contact.emailLabel' | t }}</span>
                <span class="contact-card__value">Sonia Pujol, PhD</span>
                <span class="contact-card__detail">spujol&#64;bwh.harvard.edu</span>
            </a>

            <a
                class="contact-card"
                href="https://github.com/SlicerLatinAmerica"
                target="_blank"
                rel="noopener"
            >
                <span class="contact-card__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48l-.01-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03a9.5 9.5 0 0 1 5 0c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85l-.01 2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
                        />
                    </svg>
                </span>
                <span class="contact-card__label">{{ 'contact.githubLabel' | t }}</span>
                <span class="contact-card__value">SlicerLatinAmerica</span>
                <span class="contact-card__detail">github.com/SlicerLatinAmerica</span>
            </a>
        </div>
    </div>
</main>

<app-site-footer />
