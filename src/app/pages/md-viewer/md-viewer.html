<header class="md-header">
    <div class="container md-header__inner">
        <a routerLink="/index.html" class="md-header__brand">
            <img
                src="public/assets/img/icon.svg"
                alt="3D Slicer for Latin America"
                width="56"
                height="56"
            />
        </a>
        <div class="md-header__actions">
            <a href="#" class="md-header__button" (click)="goBack($event)">&larr; Back</a>
            <button
                type="button"
                class="md-header__button"
                [disabled]="!ready()"
                (click)="copyUrl()"
            >
                {{ copyLabel() }}
            </button>
        </div>
    </div>
</header>

<main id="main" class="md-body">
    @if (error()) {
        <p class="md-error">{{ error() }}</p>
    }
    <div #content class="md-content"></div>
</main>
