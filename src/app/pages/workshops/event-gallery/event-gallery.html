<app-workshop-header>
    <h1>{{ gallery().heading }}</h1>
    <p>{{ gallery().subtitle }}</p>
</app-workshop-header>

<main class="workshop-main">
    <section class="workshop-section">
        <h2>{{ gallery().sectionTitle }}</h2>
        @for (paragraph of gallery().intro; track $index) {
            <p>{{ paragraph }}</p>
        }

        <app-gallery
            [images]="gallery().images"
            [decodingAsync]="gallery().decodingAsync ?? false"
        />

        <div class="cluster" style="margin-top: var(--space-6)">
            <a [routerLink]="'/' + gallery().backHref" class="btn-cta"
                >Back to Workshop Main Page</a
            >
            <a routerLink="/index.html" class="btn-ghost">Back to Home</a>
        </div>
    </section>
</main>

<app-site-footer [translated]="false" />
