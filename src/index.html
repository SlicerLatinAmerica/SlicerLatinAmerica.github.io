        <base href="/" />
        <title>3D Slicer for Latin America</title>
        <meta name="theme-color" content="#003366" />
        <link rel="icon" type="image/svg+xml" href="public/assets/img/icon.svg" />
        <link rel="apple-touch-icon" href="public/assets/img/icon.png" />
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('slicerla_theme');
                    document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
                } catch (e) {
                    document.documentElement.dataset.theme = 'light';
                }
            })();
        </script>
